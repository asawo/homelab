# Pi-hole v6 configuration — non-default settings only
# Full reference: https://docs.pi-hole.net/config/

[dns]
  upstreams = ["1.1.1.1", "1.0.0.1"]
  interface = "eth0"
  listeningMode = "ALL"
  hosts = [
    "192.168.11.200 pihole.lan",
    "192.168.11.61 pve.lan",
    "192.168.11.201 photos.home"
  ]

  [dns.domain]
    name = "lan"

[dhcp]
  [ntp.sync]
    active = false

[webserver]
  [webserver.api]
    # pwhash is sensitive — set via `pihole setpassword` on the host
    # pwhash = "..."
