name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check formatting (yaml, json, md)
        run: npx --yes prettier@3 --check .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose files
        run: |
          set -euo pipefail
          for dir in actualbudget adguard immich leafwiki monitoring stirling-pdf; do
            [ -f "$dir/docker-compose.yml" ] || continue
            echo "== $dir =="
            created_env=0
            if [ -f "$dir/.env.example" ] && [ ! -f "$dir/.env" ]; then
              cp "$dir/.env.example" "$dir/.env"
              created_env=1
            fi
            (cd "$dir" && docker compose config -q)
            [ "$created_env" -eq 1 ] && rm "$dir/.env"
            true
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: git ls-files '*.sh' | xargs shellcheck

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
      - name: Check shell script formatting
        run: git ls-files '*.sh' | xargs "$(go env GOPATH)/bin/shfmt" -d -i 2

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
