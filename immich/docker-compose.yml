#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    extends:
      file: hwaccel.transcoding.yml
      service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
      - '${IMMICH_API_METRICS_PORT:-8081}:${IMMICH_API_METRICS_PORT:-8081}'
      - '${IMMICH_MICROSERVICES_METRICS_PORT:-8082}:${IMMICH_MICROSERVICES_METRICS_PORT:-8082}'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    extends:
      file: hwaccel.ml.yml
      service: openvino
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
  
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  # Per-container resource metrics, scraped remotely by the central Prometheus
  # in CT 108. Port 9280 kept uniform across all 3 Docker-based LXCs. v0.60.5
  # (registry moved to ghcr.io as of v0.53.0) -- v0.49.1 predates Docker 29's
  # switch to containerd-snapshotter storage, which broke ALL per-container
  # metrics here (not just log noise): cAdvisor couldn't find the classic
  # overlay2 layerdb path Docker 29 no longer writes, and treated that as
  # fatal for the whole container rather than just skipping disk-usage
  # metrics. Fixed upstream in google/cadvisor#3709 (in v0.54.0+).
  cadvisor:
    container_name: immich_cadvisor
    image: ghcr.io/google/cadvisor:v0.60.5
    ports:
      - '9280:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # cAdvisor reads /etc/machine-id directly (not via /rootfs), and its own
      # container doesn't have one -- bind-mounting the host's makes the
      # periodic "Failed to get system UUID" error go away for good, rather
      # than relying on however cAdvisor happens to resolve /rootfs internally.
      - /etc/machine-id:/etc/machine-id:ro
    # No /dev/kmsg device mapping -- it doesn't exist inside an unprivileged LXC.
    mem_limit: 200m
    restart: always

  # Ships this LXC's Docker container logs to the central Loki. This LXC's own
  # journald (as opposed to its Docker containers) isn't currently shipped
  # anywhere -- out of scope for now, see monitoring/alloy-native.alloy's
  # comment for why the journald-shipping design changed.
  #
  # Explicit `dns:` pointing straight at AdGuard: this host's own resolv.conf
  # points to Tailscale's 100.100.100.100, which lives on the tailscale0
  # interface and isn't reachable from inside a container's network
  # namespace. Docker falls back to guessing an external resolver from the
  # host state at container-creation time, and that guess isn't reliably
  # AdGuard (observed falling back to the plain LAN gateway, which doesn't
  # know about *.home rewrites) -- causing monitoring.home to fail to
  # resolve, silently dropping shipped logs. Bypass the guesswork entirely.
  alloy:
    container_name: immich_alloy
    image: grafana/alloy:latest
    dns:
      - 192.168.11.207
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    mem_limit: 300m
    restart: always

volumes:
  model-cache:
  alloy-data:
