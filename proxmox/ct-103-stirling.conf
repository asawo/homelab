arch: amd64
cores: 2
features: nesting=1,keyctl=1
hostname: stirling-pdf
memory: 2048
mp0: /mnt/storage/files,mp=/mnt/files
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.11.1,hwaddr=BC:24:11:48:5B:F2,ip=192.168.11.203/24,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-103-disk-0,size=8G
# Swap disabled: default Proxmox swap allotment was getting pinned at ~93%
# by the JVM's normal GC activity (kernel proactively swapping cold heap
# pages under default swappiness) despite ~1.1GB of free RAM headroom in
# this LXC -- not real memory pressure, just swap thrashing that degraded
# request latency. See stirling-pdf/docker-compose.yml's JAVA_TOOL_OPTIONS
# comment for the earlier (insufficient on its own) heap-cap fix.
swap: 0
tags: stirling-pdf
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
