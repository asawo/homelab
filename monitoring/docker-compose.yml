name: monitoring

services:
  prometheus:
    container_name: monitoring_prometheus
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - '9090:9090'
    mem_limit: 500m
    restart: always

  grafana:
    container_name: monitoring_grafana
    image: grafana/grafana:11.4.0
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://monitoring.home:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    mem_limit: 300m
    restart: always

  loki:
    container_name: monitoring_loki
    image: grafana/loki:3.3.0
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - '3100:3100'
    mem_limit: 400m
    restart: always

  alertmanager:
    container_name: monitoring_alertmanager
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - '9093:9093'
    mem_limit: 100m
    restart: always

  # Bridges Alertmanager's webhook_configs receiver to ntfy.sh, reusing the same
  # NTFY_TOPIC convention as proxmox/check-storage.env. Image/version chosen at
  # build time -- see README for the current pick and why.
  alertmanager-ntfy:
    container_name: monitoring_alertmanager_ntfy
    image: xenrox/ntfy-alertmanager:latest
    env_file:
      - .env
    environment:
      NTFY_URL: https://ntfy.sh
      NTFY_TOPIC: ${NTFY_TOPIC}
    mem_limit: 50m
    restart: always

  # Agentless host + per-CT metrics via the Proxmox API. No volume/config file --
  # all config is env vars, matching this repo's secret-handling convention.
  pve-exporter:
    container_name: monitoring_pve_exporter
    image: prompve/prometheus-pve-exporter:latest
    environment:
      PVE_USER: ${PVE_API_TOKEN_ID}
      PVE_TOKEN_NAME: pve-exporter
      PVE_TOKEN_VALUE: ${PVE_API_TOKEN_SECRET}
      PVE_VERIFY_SSL: "false"
      PVE_SERVER: pve.lan
    ports:
      - '9221:9221'
    mem_limit: 150m
    restart: always

  blackbox-exporter:
    container_name: monitoring_blackbox_exporter
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - '9115:9115'
    mem_limit: 50m
    restart: always

  # AdGuard has no built-in Prometheus endpoint; this hits its JSON API instead.
  adguard-exporter:
    container_name: monitoring_adguard_exporter
    image: ghcr.io/attilagyorffy/prometheus-exporter-adguard-home:latest
    env_file:
      - .env
    ports:
      - '9617:9617'
    mem_limit: 50m
    restart: always

  # Central log relay: reads the merged journal directory written by the native
  # systemd-journal-remote receiver (host + Copyparty + FileBrowser + LeafWiki)
  # and ships it into Loki. This is the ONLY journal-side Alloy instance --
  # see README for why 4 Alloy instances instead of 7.
  alloy:
    container_name: monitoring_alloy
    image: grafana/alloy:latest
    volumes:
      - ./alloy/central-relay.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal/remote:/var/log/journal/remote:ro
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "/etc/alloy/config.alloy"]
    mem_limit: 400m
    restart: always

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
