name: monitoring

services:
  prometheus:
    container_name: monitoring_prometheus
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - '9090:9090'
    mem_limit: 500m
    restart: always

  grafana:
    container_name: monitoring_grafana
    image: grafana/grafana:11.4.0
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://monitoring.home:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    mem_limit: 300m
    restart: always

  loki:
    container_name: monitoring_loki
    image: grafana/loki:3.3.0
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - '3100:3100'
    mem_limit: 400m
    restart: always

  alertmanager:
    container_name: monitoring_alertmanager
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - '9093:9093'
    mem_limit: 100m
    restart: always

  # Bridges Alertmanager's webhook_configs receiver to ntfy.sh, reusing the same
  # NTFY_TOPIC convention as proxmox/check-storage.env. Config format is scfg,
  # not env vars -- the template is substituted with NTFY_TOPIC at container
  # start so the secret never lands in a tracked file.
  alertmanager-ntfy:
    container_name: monitoring_alertmanager_ntfy
    image: xenrox/ntfy-alertmanager:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        sed "s#__NTFY_TOPIC__#$$NTFY_TOPIC#" /etc/ntfy-alertmanager/config.template > /etc/ntfy-alertmanager/config
        exec /ntfy-alertmanager
    env_file:
      - .env
    volumes:
      - ./alertmanager-ntfy/config.scfg.template:/etc/ntfy-alertmanager/config.template:ro
    mem_limit: 50m
    restart: always

  # Agentless host + per-CT metrics via the Proxmox API. No volume/config file --
  # all config is env vars, matching this repo's secret-handling convention.
  pve-exporter:
    container_name: monitoring_pve_exporter
    image: prompve/prometheus-pve-exporter:latest
    dns:
      - 192.168.11.207
    environment:
      # PVE_USER is the bare user, not the full token ID -- that's
      # PVE_TOKEN_NAME separately. Mixing them up returns a 401.
      PVE_USER: ${PVE_API_USER}
      PVE_TOKEN_NAME: pve-exporter
      PVE_TOKEN_VALUE: ${PVE_API_TOKEN_SECRET}
      PVE_VERIFY_SSL: "false"
      PVE_SERVER: pve.lan
    ports:
      - '9221:9221'
    mem_limit: 150m
    restart: always

  # Explicit `dns:` pointing straight at AdGuard on this and the two exporters
  # below -- this LXC's own resolv.conf points to Tailscale's 100.100.100.100,
  # which lives on the tailscale0 interface and isn't reachable from inside a
  # container's network namespace, so Docker falls back to guessing an
  # external resolver (observed: the plain LAN gateway, which doesn't know
  # about *.home rewrites). See immich/docker-compose.yml's alloy service for
  # the fuller writeup -- same bug, different containers: this one silently
  # made every blackbox probe report every *.home service as down.
  blackbox-exporter:
    container_name: monitoring_blackbox_exporter
    image: prom/blackbox-exporter:v0.25.0
    dns:
      - 192.168.11.207
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - '9115:9115'
    mem_limit: 50m
    restart: always

  # AdGuard has no built-in Prometheus endpoint; this hits its JSON API instead.
  adguard-exporter:
    container_name: monitoring_adguard_exporter
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    dns:
      - 192.168.11.207
    environment:
      ADGUARD_SERVERS: ${ADGUARD_URL}
      ADGUARD_USERNAMES: ${ADGUARD_USERNAME}
      ADGUARD_PASSWORDS: ${ADGUARD_PASSWORD}
    ports:
      - '9618:9618'
    mem_limit: 50m
    restart: always

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
