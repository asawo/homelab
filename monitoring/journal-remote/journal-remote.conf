# Native systemd-journal-remote receiver config for CT 108.
# Install: apt install systemd-journal-remote
# Place at: /etc/systemd/journal-remote.conf
#
# This repo's setup is LAN/Tailscale-only (no public exposure, matching every
# other service here), so it runs plain HTTP rather than the default HTTPS
# listener -- override the systemd unit to add --listen-http=19532:
#
#   systemctl edit systemd-journal-remote.service
#   [Service]
#   ExecStart=
#   ExecStart=/usr/lib/systemd/systemd-journal-remote --listen-http=19532 --output=/var/log/journal/remote/
#
# Then: systemctl enable --now systemd-journal-remote.service
# (do NOT enable systemd-journal-remote.socket, which defaults to HTTPS)

[Remote]
Seal=no
