# Covers container/host-down, resource saturation, and failed HTTP checks --
# deliberately different failure modes than proxmox/check-storage.sh (DAS
# mount staleness + auto-remediation), so the two systems don't duplicate
# alerts. check-storage.sh's own ntfy alerting is untouched by this stack.
#
# Metric names below are prometheus-pve-exporter's documented names as of
# this writing -- verify against real scrape output once CT 108 is live and
# adjust if the exporter version in use differs.
groups:
  - name: monitoring
    rules:
      # Scoped to the in-scope LXCs only (101-103, 105-107) + the host itself
      # (id="" for the pve.lan/cluster-level series) -- Pi-hole (100) and
      # SFTPGo (104) are deliberately stopped/deprecated and would otherwise
      # false-alarm here, since pve-exporter reports on the whole cluster.
      - alert: TargetDown
        expr: pve_up{id=~"lxc/10[1235-7]|"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is unreachable"

      - alert: HttpCheckFailing
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP check failing for {{ $labels.instance }}"

      # Prometheus's own generic scrape-health signal, covers all 5 scrape
      # jobs (pve, immich, cadvisor, adguard, blackbox-http) uniformly --
      # closes the gap TargetDown leaves for every job except pve-exporter's.
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"

      # up==0 only catches "Prometheus couldn't reach the target". If
      # pve-exporter or blackbox-exporter answers scrapes successfully but
      # stops emitting its expected series (exporter-side bug, version
      # mismatch, crashed sub-collector), up stays 1 and TargetDown/
      # HttpCheckFailing never fire since their series are simply absent,
      # not 0. absent() is the standard PromQL pattern for that case.
      - alert: PveExporterMetricsMissing
        expr: absent(pve_up{id=~"lxc/10[1235-7]|"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "pve-exporter is not reporting pve_up metrics for the monitored fleet"

      - alert: BlackboxProbeMetricsMissing
        expr: absent(probe_success)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "blackbox-exporter is not reporting probe_success metrics"

      - alert: HighCpuUsage
        expr: pve_cpu_usage_ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} CPU usage above 90% for 10m"

      - alert: HighMemoryUsage
        expr: (pve_memory_usage_bytes / pve_memory_size_bytes) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} memory usage above 90% for 10m"

      - alert: RootDiskAlmostFull
        expr: (pve_disk_usage_bytes / pve_disk_size_bytes) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} root disk usage above 85% (distinct from check-storage.sh's DAS mount checks)"
