name: stirling-pdf

services:
  stirling-pdf:
    container_name: stirling_pdf
    image: stirlingtools/stirling-pdf:latest
    ports:
      - "8080:8080"
    volumes:
      - ./training-data:/usr/share/tessdata
      - ./configs:/configs
      - /mnt/files/NAS/stirling-pdf:/app/storage
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      LANGS: "en_US"
      # Without an explicit cap the JVM's ergonomic default sizes off what
      # looks like the Proxmox host's full RAM rather than this LXC's limit.
      # Kept small since the host's RAM is overcommitted.
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    restart: always
