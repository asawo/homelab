name: stirling-pdf

services:
  stirling-pdf:
    container_name: stirling_pdf
    image: stirlingtools/stirling-pdf:latest
    ports:
      - '8080:8080'
    volumes:
      - ./training-data:/usr/share/tessdata
      - ./configs:/configs
      - /mnt/files/NAS/stirling-pdf:/app/storage
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      LANGS: "en_US"
    restart: always
